openapi: 3.0.0

info:
  title: Foco Multimídia - Hotel API
  version: 1.0.0
  description: API REST desenvolvida para o desafio técnico da Foco Multimídia.

servers:
  - url: /api
    description: Ambiente local

paths:
  /rooms:
    get:
      summary: Lista todos os quartos
      tags:
        - Rooms
      responses:
        '200':
          description: Lista de quartos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'

    post:
      summary: Cadastra um quarto
      tags:
        - Rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hotel_id
                - name
              properties:
                hotel_id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Room 3 Hotel 1
      responses:
        '201':
          description: Quarto criado com sucesso
        '422':
          description: Erro de validação

  /rooms/{room}:
    parameters:
      - name: room
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Consulta um quarto
      tags:
        - Rooms
      responses:
        '200':
          description: Quarto encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '404':
          description: Quarto não encontrado

    put:
      summary: Atualiza um quarto
      tags:
        - Rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hotel_id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Room Updated
      responses:
        '200':
          description: Quarto atualizado com sucesso
        '404':
          description: Quarto não encontrado
        '422':
          description: Erro de validação

    patch:
      summary: Atualiza parcialmente um quarto
      tags:
        - Rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hotel_id:
                  type: integer
                name:
                  type: string
      responses:
        '200':
          description: Quarto atualizado com sucesso
        '404':
          description: Quarto não encontrado
        '422':
          description: Erro de validação

    delete:
      summary: Remove um quarto
      tags:
        - Rooms
      responses:
        '200':
          description: Quarto removido com sucesso
        '404':
          description: Quarto não encontrado

  /reservations:
    post:
      summary: Cria uma reserva
      tags:
        - Reservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservation'
      responses:
        '201':
          description: Reserva criada com sucesso
        '422':
          description: Dados inválidos ou quarto indisponível

components:
  schemas:
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        hotel_id:
          type: integer
          example: 1
        name:
          type: string
          example: Room 1 Hotel 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Guest:
      type: object
      required:
        - name
        - last_name
        - phone
      properties:
        name:
          type: string
          example: Joao
        last_name:
          type: string
          example: Silva
        phone:
          type: string
          example: "5577999999999"

    Daily:
      type: object
      required:
        - date
        - value
      properties:
        date:
          type: string
          format: date
          example: "2026-10-20"
        value:
          type: number
          format: float
          example: 200

    Payment:
      type: object
      required:
        - method
        - value
      properties:
        method:
          type: integer
          example: 1
        value:
          type: number
          format: float
          example: 600

    CreateReservation:
      type: object
      required:
        - room_id
        - check_in
        - check_out
        - guests
        - dailies
      properties:
        room_id:
          type: integer
          example: 5
        check_in:
          type: string
          format: date
          example: "2026-10-20"
        check_out:
          type: string
          format: date
          example: "2026-10-23"
        guests:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Guest'
        dailies:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Daily'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'